name: Release Changelog

# Runs release-scribe on itself whenever a version tag is pushed.
#
# Repo secrets (Settings → Secrets and variables → Actions):
#   GROQ_API_KEY        – Groq API key                         (required)
#   SLACK_WEBHOOK_URL   – Slack incoming webhook for the channel   (optional)
# Repo variables (same page, "Variables" tab — all optional):
#   AI_MODEL            – Groq model override (default: openai/gpt-oss-120b)

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']   # real versions only — NOT moving tags like v1
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing tag to generate notes for (e.g. v1.1.0)'
        required: true
      dry_run:
        description: 'Print the notes only; write and send nothing'
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: read   # lets source: auto read PR descriptions on private repos

concurrency:
  group: release-changelog      # one run at a time so changelog commits never race
  cancel-in-progress: false

jobs:
  changelog:
    name: Generate changelog
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.version || github.ref_name }}
    steps:
      # Check out the default branch (not the tag) so CHANGELOG.md is always the latest
      # copy and the commit below can never conflict. The tag is passed as to_ref.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history + tags are required
          ref: ${{ github.event.repository.default_branch }}

      - name: Ensure a GitHub Release exists for the tag
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --notes "Generating release notes…"

      - name: Generate changelog (this repo's own action)
        id: scribe
        uses: ./
        with:
          provider:        groq
          model:           ${{ vars.AI_MODEL }}
          api_key:         ${{ secrets.GROQ_API_KEY }}
          release_version: ${{ env.TAG }}
          to_ref:          ${{ env.TAG }}
          project_context: 'Release Scribe: a GitHub Action that writes changelogs and release notes from git commits using any LLM provider'
          update_release:  'true'
          github_token:    ${{ secrets.GITHUB_TOKEN }}
          dry_run:         ${{ github.event.inputs.dry_run || 'false' }}
          upload_artifact: 'true'
          # Posts the release summary to your Slack channel (skipped if the secret is empty)
          slack_mode:        message
          slack_webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Commit CHANGELOG.md
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          [ -f CHANGELOG.md ] || { echo "No CHANGELOG.md was generated."; exit 0; }
          git add CHANGELOG.md
          if git diff --staged --quiet; then
            echo "No changelog changes."
          else
            git commit -m "docs: update changelog for $TAG"
            git pull --rebase origin main   # main may have moved since the tag
            git push origin HEAD:main
          fi
